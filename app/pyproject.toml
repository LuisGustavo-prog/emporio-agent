[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento Tom, da Emporio da Musica"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11",
    "python-dotenv>=1.0",
    "pypdf>=4.0",
    "holidays>=0.50",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
emporio_agent = ["db/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
